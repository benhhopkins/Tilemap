<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixiJS Tilemap</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1118;
        font-family: Arial, Helvetica, sans-serif;
      }

      /*
        A deliberately offset, bordered host: the old build read raw viewport
        coordinates from pointer events, so this margin and border alone pushed
        every selection about one tile off at low zoom. The rewrite resolves
        positions through the scene graph, so the offset no longer matters.
      */
      #app {
        margin: 24px;
        border: 5px solid #000;
        line-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
